<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Thanatos</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../style.css">
</head>
<body class="shop-page">

    <!-- NAVBAR -->
    <section id="header">

        <a href="../index.html">
            <img
                src="../img/logo.png"
                class="logo"
                alt="Ecommerce Thanatos Logo"
            >
        </a>

        <div>
            <ul id="navbar">

                <i id="close-menu" class="fa-solid fa-arrow-left"></i>

                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a class="active" href="../sections/shop.html">Shop</a>
                </li>

                <li>
                    <a href="../sections/about.html">About</a>
                </li>

                <li>
                    <a href="../sections/contact.html">Contact</a>
                </li>

                <li>
                    <a href="../sections/cart.html">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </a>
                </li>

            </ul>
        </div>

        <i id="menu-btn" class="fa-solid fa-bars"></i>

    </section>


    <!-- SHOP -->
    <section id="hero">

        <section id="shop" class="section-p1">

            <!-- ENCABEZADO -->
            <div class="collection-header">

                <p class="collection-label">
                    THANATOS / COLLECTION 01
                </p>

                <h2 class="shop-title">
                    Our Collection
                </h2>

                <p class="collection-description">
                    DARKNESS IS A STATEMENT.
                </p>

            </div>


            <!-- BARRA DE COLECCIÓN -->
            <div class="collection-toolbar">

                <span>4 PRODUCTS</span>

                <span>NEW ARRIVALS ↘</span>

            </div>


            <!-- PRODUCTOS -->
            <div class="products">


                <!-- PRODUCTO 1: REMERA MEGADETH -->
                <article class="card">

                    <a href="#" class="product-image">

                        <img
                            src="../img/features/Megadeth-front.jpeg"
                            alt="Remera Megadeth vista frontal"
                            class="product-image-main"
                        >

                        <img
                            src="../img/features/Megadeth-back.jpeg"
                            alt="Remera Megadeth vista alternativa"
                            class="product-image-hover"
                        >

                        <span class="product-tag">
                            BESTSELLER
                        </span>

                    </a>

                    <div class="card-info">

                        <span class="brand">THANATOS</span>

                        <h3>Remera Megadeth</h3>

                        <div class="price-row">

                            <h4>$550</h4>

                            <button
                                type="button"
                                aria-label="Añadir Remera Megadeth al carrito"
                            >
                                <i class="fa-solid fa-plus"></i>
                            </button>

                        </div>

                    </div>

                </article>


                <!-- PRODUCTO 2: MUSCULOSA THANATOS FEAR -->
                <article class="card">

                    <a href="#" class="product-image">

                        <img
                            src="../img/features/ThanatosTankTop-front.jpeg"
                            alt="Musculosa Thanatos Fear vista frontal"
                            class="product-image-main"
                        >

                        <img
                            src="../img/features/ThanatosTankTop-back.jpeg"
                            alt="Musculosa Thanatos Fear vista alternativa"
                            class="product-image-hover"
                        >

                    </a>

                    <div class="card-info">

                        <span class="brand">THANATOS</span>

                        <h3>Musculosa Thanatos Fear</h3>

                        <div class="price-row">

                            <h4>$400</h4>

                            <button
                                type="button"
                                aria-label="Añadir Musculosa Thanatos Fear al carrito"
                            >
                                <i class="fa-solid fa-plus"></i>
                            </button>

                        </div>

                    </div>

                </article>


                <!-- PRODUCTO 3: DARK CARGO -->
                <article class="card">

                    <a href="#" class="product-image">

                        <img
                            src="../img/f1.jpg"
                            alt="Dark Cargo vista principal"
                            class="product-image-main"
                        >

                        <img
                            src="../img/DarkCargo-back.jpg"
                            alt="Dark Cargo vista alternativa"
                            class="product-image-hover"
                        >

                    </a>

                    <div class="card-info">

                        <span class="brand">THANATOS</span>

                        <h3>Dark Cargo</h3>

                        <div class="price-row">

                            <h4>$650</h4>

                            <button
                                type="button"
                                aria-label="Añadir Dark Cargo al carrito"
                            >
                                <i class="fa-solid fa-plus"></i>
                            </button>

                        </div>

                    </div>

                </article>


                <!-- PRODUCTO 4: DEVIL JACKET -->
                <article class="card">

                    <a href="#" class="product-image">

                        <img
                            src="../img/f1.jpg"
                            alt="Devil Jacket vista principal"
                            class="product-image-main"
                        >

                        <img
                            src="../img/DevilJacket-back.jpg"
                            alt="Devil Jacket vista alternativa"
                            class="product-image-hover"
                        >

                    </a>

                    <div class="card-info">

                        <span class="brand">THANATOS</span>

                        <h3>Devil Jacket</h3>

                        <div class="price-row">

                            <h4>$650</h4>

                            <button
                                type="button"
                                aria-label="Añadir Devil Jacket al carrito"
                            >
                                <i class="fa-solid fa-plus"></i>
                            </button>

                        </div>

                    </div>

                </article>


            </div>

        </section>

    </section>

    <script src="../script.js"></script>

</body>
</html>
